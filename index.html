<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Colis</title>
    <style>
        /* --- STYLE CSS --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        /* Guide visuel pour viser le nom */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60px;
            border: 2px dashed #3498db;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            border-radius: 4px;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
            width: 100%;
            max-width: 400px;
        }

        .btn:active {
            background-color: #2980b9;
        }

        #status {
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 15px;
            text-align: center;
        }

        .list-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        ol {
            padding-left: 20px;
            margin: 0;
        }

        li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }

        li:last-child {
            border-bottom: none;
        }

        /* Canvas caché servant à capturer l'image */
        canvas {
            display: none;
        }
    </style>
    <!-- Inclusion de la bibliothèque OCR Tesseract.js via CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>📦 Scanner de Colis</h1>
    <div id="status">Activation de la caméra...</div>

    <!-- Zone de la caméra -->
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="overlay"></div>
    </div>

    <button class="btn" id="capture-btn">Scanner le nom</button>

    <!-- Liste des destinataires -->
    <div class="list-container">
        <h2>📋 Destinataires (Ordre Alphabetique)</h2>
        <ol id="destinataires-list">
            <!-- Les noms s'ajouteront ici -->
        </ol>
    </div>

    <!-- Élément technique pour capturer la frame vidéo -->
    <canvas id="canvas"></canvas>

    <script>
        // --- LOGIQUE JAVASCRIPT CORRIGÉE ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const statusDiv = document.getElementById('status');
        const listOl = document.getElementById('destinataires-list');

        // Tableau pour stocker les noms
        let listeNoms = [];

        // 1. Accéder à la caméra arrière du téléphone
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: { ideal: "environment" } // Force l'utilisation de la caméra arrière
                }, 
                audio: false 
            })
            .then(stream => {
                video.srcObject = stream;
                statusDiv.innerText = "Placez le nom du destinataire dans le rectangle pointillé.";
            })
            .catch(err => {
                console.error("Erreur caméra: ", err);
                statusDiv.innerText = "Impossible d'accéder à la caméra. Vérifiez les autorisations.";
            });
        } else {
            statusDiv.innerText = "Votre navigateur ne supporte pas l'accès à la caméra.";
        }

        // 2. Capturer la photo et lancer l'OCR
        captureBtn.addEventListener('click', () => {
            statusDiv.innerText = "Analyse de l'image en cours...";
            captureBtn.disabled = true;

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Dessine l'image de la vidéo sur le canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convertit le canvas en image exploitable par Tesseract
            const dataUrl = canvas.toDataURL('image/jpeg');

            // Lancer la reconnaissance de texte (Français)
            Tesseract.recognize(dataUrl, 'fra')
            .then(({ data: { text } }) => {
                // Nettoyer le texte reçu
                let nomDetecte = nettoyerTexte(text);

                if (nomDetecte) {
                    ajouterEtTrierNom(nomDetecte);
                    statusDiv.innerText = `Nom détecté : "${nomDetecte}" !`;
                } else {
                    statusDiv.innerText = "Aucun texte lisible détecté. Réessayez.";
                }
            })
            .catch(err => {
                console.error(err);
                statusDiv.innerText = "Erreur lors de la lecture de l'image.";
            })
            .finally(() => {
                captureBtn.disabled = false;
            });
        });

        // 3. Fonction pour nettoyer le texte extrait par l'OCR (CORRIGÉE ICI)
        function nettoyerTexte(texteBrut) {
            if (!texteBrut) return null;
            // Supprime les caractères spéciaux inutiles et garde les lettres/espaces
            let propre = texteBrut.replace(/[^a-zA-ZÀ-ÿ\s]/g, '').trim();
            // On prend généralement la première ligne si le bloc de texte contient plusieurs lignes
            let lignes = propre.split('\n').map(l => l.trim()).filter(l => l.length > 2);
            return lignes.length > 0 ? lignes[0] : null;
        }

        // 4. Ajouter le nom à la liste et trier par ordre alphabétique
        function ajouterEtTrierNom(nom) {
            // Mettre en majuscule la première lettre pour l'esthétique
            let nomFormate = nom.charAt(0).toUpperCase() + nom.slice(1);
            
            // Ajouter au tableau
            listeNoms.push(nomFormate);
            
            // Tri alphabétique (gère correctement les accents en français)
            listeNoms.sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

            // Mettre à jour l'affichage HTML de la liste
            afficherListe();
        }

        // 5. Mettre à jour l'affichage de la liste
        function afficherListe() {
            listOl.innerHTML = ""; // Vider la liste actuelle
            listeNoms.forEach(nom => {
                const li = document.createElement('li');
                li.innerText = nom;
                listOl.appendChild(li);
            });
        }
    </script>

</body>
</html>
