<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Colis Pro</title>
    <style>
        /* --- STYLE VISUEL --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            color: #2c3e50;
            margin: 10px 0;
            font-size: 1.5rem;
            text-align: center;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Viseur bleu centré pour cibler le nom */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 60px;
            border: 3px dashed #00bcd4;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay::after {
            content: "CENTRER LE NOM ICI";
            color: #00bcd4;
            font-size: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        .btn {
            background-color: #00bcd4;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            width: 100%;
            max-width: 400px;
            text-transform: uppercase;
        }

        .btn:active {
            background-color: #0097a7;
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #status {
            font-size: 14px;
            font-weight: 500;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-align: center;
            min-height: 40px;
            padding: 0 10px;
        }

        .list-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        ol {
            padding-left: 20px;
            margin: 0;
        }

        li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
            font-weight: 500;
        }

        #hidden-assets {
            display: none;
        }
    </style>
    <!-- Chargement officiel de la bibliothèque Tesseract.js v5 -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>📦 Scanner de Colis</h1>
    <div id="status">Ouverture de la caméra...</div>

    <!-- Zone Caméra avec le Viseur pointillé -->
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="overlay"></div>
    </div>

    <!-- BOUTON : Cliquer pour lire lorsque le nom est bien centré -->
    <button class="btn" id="capture-btn" disabled>Scanner le nom centré</button>

    <!-- Liste dynamique triée par ordre alphabétique -->
    <div class="list-container">
        <h2>📋 Destinataires (Ordre Alphabétique)</h2>
        <ol id="destinataires-list"></ol>
    </div>

    <!-- Toile technique de capture d'image (cachée) -->
    <div id="hidden-assets">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // --- LOGIQUE APPLICATION ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const statusDiv = document.getElementById('status');
        const listOl = document.getElementById('destinataires-list');

        let listeNoms = [];
        let tesseractWorker = null;

        // Étape 1 : Activer la caméra DIRECTEMENT dès l'ouverture de la page
        function startCamera() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { ideal: "environment" }, // Force la caméra arrière du smartphone
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: false 
                })
                .then(stream => {
                    video.srcObject = stream;
                    statusDiv.innerText = "Caméra active. Initialisation du moteur de lecture...";
                    // Une fois la vidéo démarrée, on prépare le moteur d'écriture en arrière-plan
                    initOCR();
                })
                .catch(err => {
                    console.error("Erreur caméra: ", err);
                    statusDiv.innerText = "Erreur d'accès à la caméra. Veuillez accorder les permissions requises.";
                });
            } else {
                statusDiv.innerText = "Votre navigateur internet ne supporte pas l'utilisation de la caméra.";
            }
        }

        // Étape 2 : Préparer Tesseract en tâche de fond
        async function initOCR() {
            try {
                tesseractWorker = await Tesseract.createWorker('fra');
                statusDiv.innerText = "Prêt ! Alignez le nom dans le rectangle bleu et cliquez sur le bouton.";
                captureBtn.disabled = false; // Le bouton devient cliquable
            } catch (err) {
                console.error("Erreur OCR:", err);
                statusDiv.innerText = "Erreur de chargement du lecteur. Vous pouvez tout de même tenter un scan.";
                captureBtn.disabled = false;
            }
        }

        // Étape 3 : Gestion du Clic sur le Bouton de scan
        captureBtn.addEventListener('click', async () => {
            statusDiv.innerText = "📸 Capture de la zone et analyse de l'image...";
            captureBtn.disabled = true;

            try {
                const ctx = canvas.getContext('2d');
                const videoWidth = video.videoWidth;
                const videoHeight = video.videoHeight;
                
                canvas.width = videoWidth;
                canvas.height = videoHeight;
                
                // On prend la photo globale de la caméra
                ctx.drawImage(video, 0, 0, videoWidth, videoHeight);

                // On calcule le découpage exact de la boîte centrale (Viseur pointillé)
                const cropWidth = videoWidth * 0.85;
                const cropHeight = (60 / video.clientHeight) * videoHeight; 
                const cropX = (videoWidth - cropWidth) / 2;
                const cropY = (videoHeight - cropHeight) / 2;

                // Création d'un mini-canvas contenant uniquement la zone utile (le nom)
                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = cropWidth;
                cropCanvas.height = cropHeight;
                const cropCtx = cropCanvas.getContext('2d');
                
                cropCtx.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                const croppedDataUrl = cropCanvas.toDataURL('image/jpeg');

                // Secours réseau si le chargement initial avait échoué
                if (!tesseractWorker) {
                    tesseractWorker = await Tesseract.createWorker('fra');
                }

                // Soumission de la zone découpée au moteur OCR
                const { data: { text } } = await tesseractWorker.recognize(croppedDataUrl);
                let nomDetecte = nettoyerTexte(text);

                if (nomDetecte) {
                    ajouterEtTrierNom(nomDetecte);
                    statusDiv.innerHTML = `✅ Enregistré : <strong>${nomDetecte}</strong>`;
                } else {
                    statusDiv.innerText = "❌ Texte non reconnu. Vérifiez l'alignement, la netteté et réessayez.";
                }
            } catch (ocrError) {
                console.error("Erreur technique :", ocrError);
                statusDiv.innerText = "Une erreur est survenue pendant le traitement de l'image.";
            } finally {
                captureBtn.disabled = false;
            }
        });

        // Étape 4 : Filtrer les impuretés de lecture
        function nettoyerTexte(texteBrut) {
            if (!texteBrut) return null;
            // Supprime la ponctuation parasite lue par erreur, garde les lettres, espaces et tirets
            let propre = texteBrut.replace(/[^a-zA-ZÀ-ÿ\s-]/g, '').trim();
            // Découpage par ligne, élimination des lignes vides ou trop courtes (moins de 3 caractères)
            let lignes = propre.split('\n').map(l => l.trim()).filter(l => l.length > 2);
            return lignes.length > 0 ? lignes[0] : null; // Extrait la première ligne valide
        }

        // Étape 5 : Ajouter à la liste et appliquer le tri alphabétique
        function ajouterEtTrierNom(nom) {
