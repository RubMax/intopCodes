<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Colis Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            color: #2c3e50;
            margin: 10px 0;
            font-size: 1.5rem;
            text-align: center;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Viseur centré amélioré */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 60px;
            border: 3px dashed #00bcd4;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay::after {
            content: "CENTRER LE NOM ICI";
            color: #00bcd4;
            font-size: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        .btn {
            background-color: #00bcd4;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            width: 100%;
            max-width: 400px;
            text-transform: uppercase;
        }

        .btn:active {
            background-color: #0097a7;
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #status {
            font-size: 14px;
            font-weight: 500;
            color: #7f8c8d;
            margin-bottom: 10px;
            text-align: center;
            min-height: 40px;
            padding: 0 10px;
        }

        .list-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        ol {
            padding-left: 20px;
            margin: 0;
        }

        li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
            font-weight: 500;
        }

        /* Zone masquée pour le traitement d'image technique */
        #hidden-assets {
            display: none;
        }
    </style>
    <!-- Utilisation de la version stable v5 de Tesseract.js du CDN officiel -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <h1>📦 Scanner de Colis</h1>
    <div id="status">Initialisation du moteur de lecture...</div>

    <!-- Zone Caméra avec Viseur -->
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div class="overlay"></div>
    </div>

    <!-- BOUTON DEMANDÉ : Clic pour lire quand c'est centré -->
    <button class="btn" id="capture-btn" disabled>Scanner le nom centré</button>

    <!-- Liste triée -->
    <div class="list-container">
        <h2>📋 Destinataires (Ordre Alphabétique)</h2>
        <ol id="destinataires-list"></ol>
    </div>

    <!-- Éléments techniques invisibles pour découper la photo -->
    <div id="hidden-assets">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const statusDiv = document.getElementById('status');
        const listOl = document.getElementById('destinataires-list');

        let listeNoms = [];
        let tesseractWorker = null;

        // Étape 1 : Initialiser proprement le moteur Tesseract.js v5 (Moteur OCR)
        async function initOCR() {
            try {
                statusDiv.innerText = "Chargement du dictionnaire français...";
                // Version moderne de l'initialisation du Worker sur Tesseract v5
                tesseractWorker = await Tesseract.createWorker('fra');
                
                statusDiv.innerText = "Prêt ! Activez votre caméra.";
                startCamera();
            } catch (err) {
                console.error("Erreur OCR:", err);
                statusDiv.innerText = "Erreur de chargement du moteur de lecture. Vérifiez votre connexion.";
            }
        }

        // Étape 2 : Activer la caméra arrière du téléphone
        function startCamera() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: false 
                })
                .then(stream => {
                    video.srcObject = stream;
                    statusDiv.innerText = "Alignez le nom dans le rectangle bleu pointillé puis cliquez sur le bouton.";
                    captureBtn.disabled = false; // On active le bouton une fois que tout est prêt
                })
                .catch(err => {
                    console.error("Erreur caméra: ", err);
                    statusDiv.innerText = "Accès caméra refusé ou non trouvé. Autorisez l'appareil photo.";
                });
            } else {
                statusDiv.innerText = "Navigateur non compatible avec la caméra.";
            }
        }

        // Étape 3 : Clic sur le bouton -> Capturer, découper l'image (Crop) et lire
        captureBtn.addEventListener('click', async () => {
            statusDiv.innerText = "📸 Capture et analyse du texte...";
            captureBtn.disabled = true;

            const ctx = canvas.getContext('2d');
            
            // On récupère la vraie taille du flux vidéo de la caméra
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            
            canvas.width = videoWidth;
            canvas.height = videoHeight;
            
            // Étape technique essentielle : On dessine la frame vidéo complète sur un canvas temporaire
            ctx.drawImage(video, 0, 0, videoWidth, videoHeight);

            // Pour une meilleure précision, on calcule la zone exacte correspondant au viseur pointillé (85% de large, 60px de haut au centre)
            // On applique ce ratio à la taille réelle de la vidéo
            const cropWidth = videoWidth * 0.85;
            const cropHeight = (60 / video.clientHeight) * videoHeight; 
            const cropX = (videoWidth - cropWidth) / 2;
            const cropY = (videoHeight - cropHeight) / 2;

            // On crée un deuxième canvas de la taille exacte du viseur pour isoler le texte
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = cropWidth;
            cropCanvas.height = cropHeight;
            const cropCtx = cropCanvas.getContext('2d');
            
            // Copie uniquement la zone du viseur
            cropCtx.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
            
            const croppedDataUrl = cropCanvas.toDataURL('image/jpeg');

            try {
                // Lancement de la reconnaissance sur l'image découpée
                const { data: { text } } = await tesseractWorker.recognize(croppedDataUrl);
                
                let nomDetecte = nettoyerTexte(text);

                if (nomDetecte) {
                    ajouterEtTrierNom(nomDetecte);
                    statusDiv.innerHTML = `✅ Succès ! <br>Nom enregistré : <strong>${nomDetecte}</strong>`;
                } else {
                    statusDiv.innerText = "❌ Lecture difficile... Assurez-vous que le texte soit bien net, droit et sans ombre.";
                }
            } catch (ocrError) {
                console.error("Erreur durant la reconnaissance :", ocrError);
                statusDiv.innerText = "Erreur technique lors de l'analyse.";
            } finally {
                captureBtn.disabled = false;
            }
        });

        // Étape 4 : Nettoyage fin de la chaîne détectée
        function nettoyerTexte(texteBrut) {
            if (!texteBrut) return null;
            // Ne garder que lettres, espaces et tirets (supprime la ponctuation parasite lue par erreur)
            let propre = texteBrut.replace(/[^a-zA-ZÀ-ÿ\s-]/g, '').trim();
            // On divise par ligne et prend la plus cohérente
            let lignes = propre.split('\n').map(l => l.trim()).filter(l => l.length > 2);
            return lignes.length > 0 ? lignes[0] : null;
        }

        // Étape 5 : Enregistrement et tri automatique
        function ajouterEtTrierNom(nom) {
